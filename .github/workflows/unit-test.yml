name: Unit Test (Elasticsearch)

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.12.1
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        options: >-
          --health-cmd="curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=60s || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Wait for Elasticsearch
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:9200 >/dev/null; then
              echo "Elasticsearch is up"
              break
            fi
            echo "Waiting for Elasticsearch..."
            sleep 2
          done

      - name: Run Unit Tests
        run: mvn -B -ntp -DskipTests=false -Dmaven.test.skip=false test
